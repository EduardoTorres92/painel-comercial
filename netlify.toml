# Build: gera os dados fictícios, roda os testes e publica o site estático.
[build]
  base = "web"
  command = "pip install -r ../pipeline/requirements.txt && npm run dados && npm test && npm run build"
  publish = "dist"   # relativo a base: web/dist

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
